name: trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch trusted base history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main:refs/remotes/origin/main
      - name: Install Trust runtime dependencies
        run: apt-get update && apt-get install -y python3 curl
      - name: Resolve comparison range
        id: comparison
        run: echo "range=${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@fcc889f54d8b4892a81af463c5a0250e2be66fc5 # v1.2.0
        with:
          range: ${{ steps.comparison.outputs.range }}
