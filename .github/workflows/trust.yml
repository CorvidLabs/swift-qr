name: trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch trusted base history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main:refs/remotes/origin/main
      - name: Install Trust runtime dependencies
        run: apt-get update && apt-get install -y python3 curl
      - name: Resolve comparison range
        id: comparison
        run: echo "range=${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@dd52a7a90ffbc1d2b1030e37007c18274f3d96bc # v1.2.1
        with:
          range: ${{ steps.comparison.outputs.range }}
